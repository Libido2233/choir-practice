<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>声部练习室</title>
<style>
:root{color-scheme:light;--ink:#203e3d;--green:#12695e;--line:#dce5de;--paper:#fffefb}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}*{box-sizing:border-box}body{margin:0;background:#f2f4f0;color:var(--ink);font:15px/1.6 "Microsoft YaHei",sans-serif}
main{max-width:1120px;margin:auto;padding:26px 24px calc(130px + env(safe-area-inset-bottom,0px))}header{padding:0 4px}h1{overflow-wrap:anywhere;margin:4px 0;font-size:28px;letter-spacing:.02em}h2{font-size:19px;margin:0}.muted{font-size:13px;color:#647b75}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 3px 16px #254f3d05}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,select,input[type=number]{font:inherit;color:inherit;border:1px solid #ccdad1;border-radius:10px;padding:8px 12px;background:white;max-width:100%}button{cursor:pointer;min-height:42px;font-weight:500;transition:background .15s,border-color .15s}button:hover{background:#edf5ef;border-color:#82ac97}button:active{background:#dfeee3}button:disabled{opacity:.45;cursor:default}button.primary{background:var(--green);color:white;border-color:var(--green);min-width:140px}button.primary:hover{background:#0b584e}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #76b69b;outline-offset:3px}
input[type=number]{width:76px}input[type=range],input[type=checkbox]{accent-color:var(--green)}input[type=checkbox]{width:16px;height:16px;vertical-align:middle;margin:0 5px 0 0;cursor:pointer}label{cursor:pointer}
.practice-choice{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.practice-choice select{margin-left:8px;background:#edf5ef;border-color:#a9c6b4;font-weight:600;min-width:150px}.tempo-row{margin-top:16px}
#status{flex:1;min-width:150px}#progress{height:5px;background:#e8eee6;border-radius:9px;margin:18px 0 12px;overflow:hidden}#progress i{display:block;background:var(--green);height:100%;width:0}#pitch{font-size:21px;font-weight:600}
#mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:8px;margin-top:10px}.channel{display:flex;flex-wrap:wrap;align-items:center;gap:9px;background:#f4f7f2;border:1px solid #e4ebe1;border-radius:10px;padding:10px 12px;min-width:0}.channel label{min-width:90px;font-size:14px;white-space:nowrap}.volume-control{display:flex;flex-shrink:0;align-items:center;gap:5px;margin-left:auto}.volume-control button{min-width:36px;min-height:38px;padding:4px 8px;font-size:20px;line-height:1}.volume-control input[type=number]{width:56px;padding:6px 2px;text-align:center;appearance:textfield;-moz-appearance:textfield;font-variant-numeric:tabular-nums}.volume-control input::-webkit-inner-spin-button,.volume-control input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.channel output{font-size:12px;color:#597167}
.toolbar{min-width:0;justify-content:space-between;margin-bottom:16px}.toolbar button{font-size:14px}
.focus{background:white;border:1px solid #a9c4b4;border-radius:12px;padding:14px}.context{background:#f5f7f2;border:1px solid #e3e9df;border-radius:12px;padding:14px;margin-top:14px}.heading{overflow-wrap:anywhere;font-size:14px;margin-bottom:8px;color:#627a6e}.part-label{font-size:13px;font-weight:600;margin:12px 0 4px}.part-label.solo{color:#59788a}#ownLabel{border-top:1px solid #dce7dd;padding-top:10px;color:var(--green)}
.staff-scroll{overflow:hidden;border-radius:6px;background:white;min-width:0}.staff-content{width:100%;min-width:0;position:relative}.scoreline{position:relative}.scoreline img{display:block;width:100%}.shade{position:absolute;top:0;height:100%;background:#0c8d7114;pointer-events:none}.cursor{position:absolute;top:20%;height:60%;width:3px;background:#d07020;display:none;pointer-events:none}.numbers svg{display:block;width:100%;height:auto}.numbers .sounding text{fill:#c06a12}.lyrics{container-type:inline-size}@supports(font-size:1cqw){.lyrics .lyric-verse{font-size:clamp(10px,2cqw,21px)}}.lyric-verse{position:relative;height:32px;margin:3px 0 5px;font:clamp(10px,2vw,21px)/1.5 "Times New Roman","SimSun",serif;color:#203e3d}.lyric-word{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}.lyric-word.sounding{color:#b75f0d;font-weight:bold}.lyric-extension{position:absolute;top:25px;border-bottom:1px solid currentColor}
#barlinks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}#barlinks button{font-size:13px;padding:3px 10px;min-height:32px;border-radius:7px}#barlinks button.active{background:var(--green);color:white}.note-preview{background:#edf5ef;border:1px solid #a8c6b1;border-radius:12px;padding:16px}.note-preview .section-title{font-size:19px;margin-bottom:14px}#pitchlist{display:grid;gap:12px}.note-group{background:#fffefb;border:1px solid #d1e0d4;border-radius:10px;padding:12px}.note-group-title{font-size:13px;color:#587467;margin-bottom:9px}.note-buttons{display:flex;flex-wrap:wrap;gap:8px}#pitchlist button{font-size:15px;font-weight:600;padding:10px 14px;min-width:80px;min-height:46px;background:white;border-color:#75a88b;color:#125d43;box-shadow:0 2px 0 #c6dccc}#pitchlist button:hover{background:#dcefe1;border-color:#376f50}#pitchlist button:active{box-shadow:none;transform:translateY(1px)}.badge{background:#eaf2e8;border-radius:7px;padding:3px 9px;font-size:13px}
.practice-section{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.section-title{font-size:15px;font-weight:600;color:var(--green);margin:0 0 10px}#draft{background:#fff0d5;padding:12px;border-radius:8px;margin:14px 0}[hidden]{display:none!important}
@media(max-width:650px){main{padding:16px 10px calc(180px + env(safe-area-inset-bottom,0px))}.card{padding:14px;border-radius:14px}h1{font-size:24px}.focus,.context{padding:8px}.channel{padding:9px 10px}.channel label{min-width:85px}#pitch{font-size:19px}.toolbar{gap:10px}.toolbar>.row{gap:6px}.toolbar button{padding:7px 9px;min-height:38px}.practice-choice select{min-width:130px}}
.playback-dock{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fffefbf5;border-top:1px solid #c7d9cc;box-shadow:0 -4px 20px #203e3d0d;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px))}.playback-dock>.row{max-width:1072px;margin:auto}.playback-dock #status{min-width:120px}@media(max-width:650px){.playback-dock{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}.playback-dock>.row{gap:7px}.playback-dock button{font-size:14px;padding:8px 10px}.playback-dock button.primary{min-width:126px}.playback-dock #status{flex-basis:100%;font-size:12px}}
</style>
<main>
<header><h1 id="title"></h1><div id="draft" hidden></div></header>
<section class="card" aria-label="播放与声部">

<div class="row practice-choice"><label>我练 <select id="part"></select></label></div>
<div class="mix-section"><div class="heading" style="margin-top:16px">听哪些声部</div><div id="mix"></div></div>
<div class="row tempo-row"><label>速度 <input id="tempo" type="number" min="20" max="300"> BPM</label><button id="slow">慢练</button><button id="normal">原速</button></div>
<section class="practice-section" aria-label="分段练习"><h3 class="section-title">分段练习</h3><div class="row" style="margin-top:10px"><label>从第 <input id="from" type="number" min="1" value="1"> 小节</label><label>到第 <input id="to" type="number" min="1"> 小节</label><label><input id="loop" type="checkbox"> 循环</label><label><input id="countin" type="checkbox" checked> 预备拍</label><label><input id="click" type="checkbox"> 节拍器</label></div></section>
<div id="progress"><i></i></div><div class="row"><span id="location" class="badge"></span><span id="pitch">准备开始</span></div>
</section>
<section class="card" aria-label="当前行与下一行谱面">
<div class="row toolbar"><h2 id="scoreTitle"></h2><div class="row"><button id="prev">← 上一行</button><span id="lineLabel" class="muted"></span><button id="next">下一行 →</button><button id="lineplay">只练当前行</button></div></div>
<div class="row" style="margin-bottom:14px"><label for="referencePart">参照声部</label><select id="referencePart"></select></div>
<div class="focus"><div class="heading" id="currentCaption"></div><div id="barlinks"></div><div id="referenceRows"></div><div id="ownLabel" class="part-label"></div><div id="ownScroll" class="staff-scroll"><div class="staff-content"><div class="scoreline"><img id="score" alt="当前行的声部谱"><div id="shade" class="shade"></div><div id="cursor" class="cursor"></div></div><div id="currentLyrics" class="lyrics"></div><div id="currentNumbers" class="numbers"></div></div></div></div>
<div id="nextContext" class="context"><div class="row heading" style="justify-content:space-between"><span id="nextCaption"></span><div class="row"><button id="nextFocus">切到下一行</button></div></div><div class="staff-scroll"><div class="staff-content"><div class="scoreline"><img id="nextScore" alt="下一行的声部谱"></div><div id="nextLyrics" class="lyrics"></div><div id="nextNumbers" class="numbers"></div></div></div></div>
<section class="practice-section note-preview" aria-label="逐个听音"><h3 class="section-title">逐个听音</h3><div id="pitchlist"></div></section>
</section>
</main>
<div class="playback-dock" role="region" aria-label="播放控制"><div class="row"><button class="primary" id="play">▶ 开始练习</button><button id="reset">回到起点</button><span id="status" role="status" class="muted"></span></div></div>
<!-- Piano: Salamander Grand Piano, Alexander Holm. CC BY 3.0 https://creativecommons.org/licenses/by/3.0/ . Source https://github.com/Tonejs/audio/tree/master/salamander . Pitch shifting and envelopes applied. -->
<script>
'use strict';
const DATA=__CHOIR_DATA__,PIANO=__PIANO_SAMPLES__;
const $=id=>document.getElementById(id),N=DATA.bars.length;
const text=(id,value)=>{$(id).textContent=value};
let referenceChoice='auto';
let selected=DATA.defaultPart,viewSystem=0,currentBar=1,ctx,master,loading,buffers={},noiseBuffer;
let playing=false,nodes=[],timer=null,origin=0,startBeat=0,endBeat=DATA.totalBeats,resumeBeat=null,runTempo=DATA.bpm;
const volumes={},gains={},sliders={},outputs={},audible={},listenChecks={};
const part=()=>DATA.parts.find(p=>p.id===selected);
const systemBars=sid=>DATA.bars.filter(b=>b.system===sid);
function updateGain(id){if(gains[id])gains[id].gain.value=audible[id]?volumes[id]/100:0}
function setVolume(id,value){volumes[id]=Math.max(0,Math.min(100,Number(value)||0));sliders[id].value=volumes[id];outputs[id].textContent='%';updateGain(id)}
function setAudible(id,value){audible[id]=!!value;listenChecks[id].checked=!!value;updateGain(id)}
function initialMix(){for(const p of DATA.parts){setAudible(p.id,p.id===selected||p.role==='solo');setVolume(p.id,p.id===selected?100:p.role==='solo'?35:25)}}
async function audio(){
 if(!ctx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw new Error('浏览器不支持音频');ctx=new Audio();master=ctx.createGain();master.gain.value=.5;const compressor=ctx.createDynamicsCompressor();master.connect(compressor);compressor.connect(ctx.destination);for(const p of DATA.parts){const g=ctx.createGain();g.gain.value=audible[p.id]?volumes[p.id]/100:0;g.connect(master);gains[p.id]=g}noiseBuffer=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const samples=noiseBuffer.getChannelData(0);for(let i=0;i<samples.length;i++)samples[i]=Math.random()*2-1}
 await ctx.resume();
 if(!loading)loading=Promise.all(Object.entries(PIANO).map(async([key,b64])=>{buffers[key]=await ctx.decodeAudioData(Uint8Array.from(atob(b64),c=>c.charCodeAt(0)).buffer)})).catch(e=>{loading=null;throw e});
 await loading;
}
function tone(pitch,when,duration,id,preview=false){
 const key=Object.keys(buffers).map(Number).sort((a,b)=>Math.abs(a-pitch)-Math.abs(b-pitch))[0];const source=ctx.createBufferSource(),g=ctx.createGain();source.buffer=buffers[key];source.playbackRate.value=2**((pitch-key)/12);source.connect(g);g.connect(preview?master:gains[id]);g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(.65,when+.005);g.gain.setValueAtTime(.65,when+Math.max(.006,duration));g.gain.linearRampToValueAtTime(0,when+duration+.18);source.start(when);source.stop(when+duration+.19);nodes.push(source);
}
function drum(key,when,id,preview=false){const g=ctx.createGain();g.connect(preview?master:gains[id]);let source,length;if(key===35||key===36){source=ctx.createOscillator();source.frequency.setValueAtTime(130,when);source.frequency.exponentialRampToValueAtTime(45,when+.14);length=.2}else{source=ctx.createBufferSource();source.buffer=noiseBuffer;const filter=ctx.createBiquadFilter();filter.type=(key===42||key===44||key===46)?'highpass':'bandpass';filter.frequency.value=filter.type==='highpass'?6500:1500;source.connect(filter);filter.connect(g);length=filter.type==='highpass'?.07:.18}if(source.frequency)source.connect(g);g.gain.setValueAtTime(.6,when);g.gain.exponentialRampToValueAtTime(.001,when+length);source.start(when);source.stop(when+length+.01);nodes.push(source)}
function click(when,strong){const source=ctx.createOscillator(),g=ctx.createGain();source.frequency.value=strong?1200:850;source.connect(g);g.connect(master);g.gain.setValueAtTime(.13,when);g.gain.exponentialRampToValueAtTime(.001,when+.055);source.start(when);source.stop(when+.06);nodes.push(source)}
function kill(){for(const n of nodes){try{n.stop()}catch{}}nodes=[];clearInterval(timer);timer=null}
function stop(keep=false){resumeBeat=keep&&playing?Math.max(startBeat,Math.min(endBeat,startBeat+(ctx.currentTime-origin)*runTempo/60)):null;playing=false;kill();text('play',keep?'▶ 继续练习':'▶ 开始练习');$('cursor').style.display='none';for(const id of ['currentNumbers','currentLyrics'])for(const n of $(id).querySelectorAll('[data-event]'))n.classList.remove('sounding')}
function range(){const a=Math.max(1,Math.min(N,Math.round(Number($('from').value)||1))),b=Math.max(a,Math.min(N,Math.round(Number($('to').value)||N)));$('from').value=a;$('to').value=b;return [DATA.bars[a-1].beat,DATA.bars[b-1].beat+DATA.bars[b-1].dur,a,b]}
async function play(){
 if(playing){stop(true);text('status','已暂停');return}
 $('play').disabled=true;text('status','准备钢琴音色…');
 try{await audio();kill();const [lo,hi,a]=range();startBeat=resumeBeat!==null&&resumeBeat>=lo&&resumeBeat<hi?resumeBeat:lo;endBeat=hi;runTempo=Math.max(20,Math.min(300,Number($('tempo').value)||DATA.bpm));const sec=60/runTempo,bar=DATA.bars[a-1],step=4/bar.beatType,pre=$('countin').checked?bar.beats*step:0;origin=ctx.currentTime+.12+pre*sec;playing=true;resumeBeat=null;text('play','Ⅱ 暂停');for(let b=0;b<pre-.00001;b+=step)click(origin-(pre-b)*sec,b===0);
 for(const p of DATA.parts)for(const e of p.sounds){const a=Math.max(startBeat,e.beat),b=Math.min(endBeat,e.beat+e.dur);if(b>a){const when=origin+(a-startBeat)*sec;if(p.role==='percussion'){if(e.beat>=startBeat)drum(e.midi,when,p.id)}else tone(e.midi,when,(b-a)*sec,p.id)}}
 if($('click').checked)for(const b of DATA.bars){const pulse=4/b.beatType;for(let offset=0;offset<b.dur-.00001;offset+=pulse){const beat=b.beat+offset;if(startBeat<=beat&&beat<endBeat)click(origin+(beat-startBeat)*sec,offset===0)}}
 timer=setInterval(tick,35);tick();
 }catch(e){stop();text('status','音频未能启动，请点击重试或用系统浏览器打开。');console.error(e)}finally{$('play').disabled=false}
}
function tick(){
 const beat=startBeat+(ctx.currentTime-origin)*runTempo/60;
 if(beat<startBeat){text('status','预备…');return}
 if(beat>=endBeat){const loop=$('loop').checked;stop();text('status',loop?'再次练习…':'这一段已练完');if(loop)play();return}
 text('status','跟着自己的声部唱');$('progress').firstElementChild.style.width=100*(beat-startBeat)/(endBeat-startBeat)+'%';const b=DATA.bars.find(b=>b.beat<=beat&&beat<b.beat+b.dur)||DATA.bars.at(-1);currentBar=b.number;if(viewSystem!==b.system)showSystem(b.system);highlightBar(b.number);text('location','第 '+b.label+' 小节 · 第 '+(Math.floor((beat-b.beat)/(4/b.beatType))+1)+' 拍');
 const active=part().events.filter(e=>e.midi!==null&&!e.optional&&!e.grace&&e.beat<=beat&&beat<e.beat+e.dur);text('pitch',active.length?active.map(noteName).join(' + '):'休止');const e=active.find(e=>e.x!==undefined&&e.x!==null);$('cursor').style.display=e?'block':'none';if(e){$('cursor').style.left=e.x*100+'%';}
 for(const n of $('currentLyrics').querySelectorAll('[data-event]')){const start=Number(n.dataset.beat),end=Number(n.dataset.end);n.classList.toggle('sounding',start<=beat&&beat<end)}
 for(const n of $('currentNumbers').querySelectorAll('[data-event]')){const st=Number(n.dataset.beat),dur=Number(n.dataset.duration);n.classList.toggle('sounding',dur>0&&st<=beat&&beat<st+dur)}
}
function noteName(e){if(e.name)return e.name;return ['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'][e.midi%12]+(Math.floor(e.midi/12)-1)}
function highlightBar(n){const b=DATA.bars[n-1];$('shade').style.display=b.left===undefined||b.right===undefined?'none':'block';if(b.left!==undefined){$('shade').style.left=b.left*100+'%';$('shade').style.width=(b.right-b.left)*100+'%'}for(const e of $('barlinks').children)e.classList.toggle('active',Number(e.dataset.bar)===n)}
function rowCaption(prefix,sid){const bs=systemBars(sid);return prefix+' · 第 '+bs[0].label+'–'+bs.at(-1).label+' 小节'}
function lyricsSVG(p,sid){
 const lyrics=(p.lyrics||[]).filter(l=>l.system===sid);if(!lyrics.length)return '';
 const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
 const indices=new Map(p.events.map((e,i)=>[e.eventIndex??i,e]));const x=e=>100*(e.numberX??e.x??0);const verses=[...new Set(lyrics.map(l=>l.verse||1))].sort((a,b)=>a-b);const out=[];
 for(const verse of verses){out.push(`<div class="lyric-verse" role="group" aria-label="${escape(p.name)}歌词">`);for(const l of lyrics.filter(l=>(l.verse||1)===verse)){const e=indices.get(l.eventIndex);if(!e)continue;const xx=x(e);out.push(`<span class="lyric-word" style="left:${xx}%" data-event="${e.eventIndex}" data-beat="${l.beat}" data-end="${l.endBeat}">${escape(l.text)}</span>`);if(l.extend&&l.extendTo!==undefined){const last=indices.get(l.extendTo),end=last&&DATA.bars[last.bar-1]?.system===sid?x(last):xx;if(end>xx)out.push(`<span class="lyric-extension" style="left:calc(${xx}% + 16px);width:calc(${end-xx}% - 16px)" aria-hidden="true"></span>`)}}out.push('</div>')}
 return out.join('');
}
function getReferencePart(){return referenceChoice==='auto'?DATA.parts.find(p=>p.role==='solo'&&p.id!==selected):DATA.parts.find(p=>p.id===referenceChoice&&p.id!==selected)}
function referenceChoices(){
 if(referenceChoice===selected)referenceChoice='';
 const menu=$('referencePart');menu.replaceChildren();
 const solo=DATA.parts.find(p=>p.role==='solo'&&p.id!==selected);
 for(const [value,label] of [['auto',solo?'默认（'+solo.name+'）':'默认（不显示）'],['','不显示'],...DATA.parts.filter(p=>p.id!==selected).map(p=>[p.id,p.name])]){const option=document.createElement('option');option.value=value;option.textContent=label;menu.append(option)}
 menu.value=referenceChoice;
}
function showSystem(id){
 viewSystem=Math.max(0,Math.min(DATA.systemCount-1,id));const p=part(),row=p.systems[viewSystem],bs=systemBars(viewSystem);$('score').src=row.image;$('currentLyrics').innerHTML=lyricsSVG(p,viewSystem);$('currentNumbers').innerHTML=row.numbers;text('ownLabel',p.name);text('scoreTitle','跟着 '+p.name+' 练');text('currentCaption',rowCaption('当前行',viewSystem));text('lineLabel',(viewSystem+1)+' / '+DATA.systemCount);$('prev').disabled=viewSystem===0;$('next').disabled=viewSystem===DATA.systemCount-1;$('cursor').style.display='none';$('ownScroll').scrollLeft=0;
 $('referenceRows').replaceChildren();for(const reference of [getReferencePart()].filter(Boolean)){const label=document.createElement('div');label.className='part-label solo';label.textContent=reference.name;const wrap=document.createElement('div');wrap.className='staff-scroll';const inside=document.createElement('div');inside.className='staff-content';const img=document.createElement('img');img.style.width='100%';img.style.display='block';img.alt='当前行的 '+reference.name+' 谱';img.src=reference.systems[viewSystem].image;const lyrics=document.createElement('div');lyrics.className='lyrics';lyrics.innerHTML=lyricsSVG(reference,viewSystem);inside.append(img,lyrics);wrap.append(inside);$('referenceRows').append(label,wrap)}
 const preview=p,next=preview.systems[viewSystem+1];$('nextContext').hidden=!next;if(next){$('nextScore').src=next.image;$('nextLyrics').innerHTML=lyricsSVG(preview,viewSystem+1);$('nextNumbers').innerHTML=next.numbers;text('nextCaption',rowCaption('下一行',viewSystem+1)+' · '+preview.name)}
 $('barlinks').replaceChildren();for(const b of bs){const button=document.createElement('button');button.textContent='第 '+b.label+' 小节';button.dataset.bar=b.number;button.onclick=()=>selectBar(b.number);$('barlinks').append(button)}
 $('pitchlist').replaceChildren();for(const b of bs){const group=document.createElement('div');group.className='note-group';const label=document.createElement('div');label.className='note-group-title';label.textContent='第 '+b.label+' 小节';const buttons=document.createElement('div');buttons.className='note-buttons';for(const e of p.events.filter(e=>e.bar===b.number&&e.midi!==null)){const button=document.createElement('button');const name=(e.optional?'备选 ':e.grace?'倚音 ':'')+noteName(e);button.textContent='▶ '+name;button.setAttribute('aria-label','试听 '+name);button.onclick=()=>single(e,p);buttons.append(button)}if(!buttons.children.length){const rest=document.createElement('span');rest.className='muted';rest.textContent='休止';buttons.append(rest)}group.append(label,buttons);$('pitchlist').append(group)}highlightBar(bs.some(b=>b.number===currentBar)?currentBar:bs[0].number);
}
function selectBar(n){stop();currentBar=n;$('from').value=n;$('to').value=n;showSystem(DATA.bars[n-1].system);text('location','第 '+DATA.bars[n-1].label+' 小节');text('pitch','准备开始');text('status','已选择小节，点击开始练习。')}
async function single(e,p=part()){stop();try{await audio();if(p.role==='percussion')drum(e.midi,ctx.currentTime+.02,p.id,true);else tone(e.midi,ctx.currentTime+.02,1.2,p.id,true);text('pitch',noteName(e));text('status','单音试听 · '+p.name)}catch(err){text('status','音频未能启动，请用系统浏览器重试。');console.error(err)}}
function init(){
 document.title=DATA.title+' · 声部练习室';text('title',DATA.title);if(DATA.unchecked.length){$('draft').hidden=false;text('draft','待校对：'+DATA.unchecked.join('、'))}
 for(const p of DATA.parts){const option=document.createElement('option');option.value=p.id;option.textContent=p.name;$('part').append(option);const row=document.createElement('div');row.className='channel';const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label','播放'+p.name);check.onchange=()=>{setAudible(p.id,check.checked);savePreferences()};listenChecks[p.id]=check;label.append(check,document.createTextNode(' '+p.name));const controls=document.createElement('div');controls.className='volume-control';const slider=document.createElement('input');slider.id='volume-'+p.id;slider.type='number';slider.min=0;slider.max=100;slider.step=5;slider.inputMode='numeric';slider.setAttribute('aria-label',p.name+'音量百分比');const output=document.createElement('output');output.htmlFor=slider.id;sliders[p.id]=slider;outputs[p.id]=output;slider.onchange=()=>{setVolume(p.id,slider.value);savePreferences()};const lower=document.createElement('button'),higher=document.createElement('button');lower.textContent='−';higher.textContent='+';lower.setAttribute('aria-label',p.name+'音量降低10%');higher.setAttribute('aria-label',p.name+'音量提高10%');lower.onclick=()=>{setVolume(p.id,volumes[p.id]-10);savePreferences()};higher.onclick=()=>{setVolume(p.id,volumes[p.id]+10);savePreferences()};controls.append(lower,slider,output,higher);row.append(label,controls);$('mix').append(row)}
 $('part').value=selected;$('tempo').value=DATA.bpm;$('from').max=N;$('to').max=N;$('to').value=N;text('slow','慢练 '+Math.max(20,Math.round(DATA.bpm*.75)));text('normal','原速 '+DATA.bpm);text('location','第 '+DATA.bars[0].label+' 小节');initialMix();showSystem(0);
 $('part').onchange=()=>{selected=$('part').value;referenceChoices();showSystem(viewSystem);text('pitch','准备开始');savePreferences()};$('referencePart').onchange=()=>{referenceChoice=$('referencePart').value;showSystem(viewSystem);savePreferences()};$('play').onclick=play;
 $('reset').onclick=()=>{stop();const[a,,n]=range();currentBar=n;showSystem(DATA.bars[n-1].system);text('location','第 '+DATA.bars[n-1].label+' 小节');text('pitch','准备开始');text('status','已回到所选范围起点');$('progress').firstElementChild.style.width='0%'};

 for(const id of ['tempo','from','to','countin','click'])$(id).onchange=()=>{stop();range();$('tempo').value=Math.max(20,Math.min(300,Number($('tempo').value)||DATA.bpm));text('status','设置已更新，点击开始练习。')};
 $('slow').onclick=()=>{stop();$('tempo').value=Math.max(20,Math.round(DATA.bpm*.75));text('status','已设为慢练速度')};$('normal').onclick=()=>{stop();$('tempo').value=DATA.bpm;text('status','已恢复原速')};
 $('prev').onclick=()=>{stop();showSystem(viewSystem-1)};$('next').onclick=()=>{stop();showSystem(viewSystem+1)};$('nextFocus').onclick=$('next').onclick;$('lineplay').onclick=()=>{stop();const bs=systemBars(viewSystem);$('from').value=bs[0].number;$('to').value=bs.at(-1).number;play()};
 loadPreferences();referenceChoices();showSystem(0);
}
function savePreferences(){try{localStorage.setItem('choir-practice:'+DATA.title,JSON.stringify({selected,referenceChoice,volumes,audible}))}catch{}}
function loadPreferences(){try{const p=JSON.parse(localStorage.getItem('choir-practice:'+DATA.title)||'null');if(!p)return;if(DATA.parts.some(x=>x.id===p.selected)){selected=p.selected;$('part').value=selected}if(p.referenceChoice==='auto'||p.referenceChoice===''||DATA.parts.some(x=>x.id===p.referenceChoice))referenceChoice=p.referenceChoice;for(const part of DATA.parts){if(typeof p.volumes?.[part.id]==='number')setVolume(part.id,p.volumes[part.id]);if(typeof p.audible?.[part.id]==='boolean')setAudible(part.id,p.audible[part.id])}}catch{}}
window.addEventListener('pagehide',savePreferences);
init();
</script>
